[package]
name = "doslet-static-game-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doslet-runtime = { workspace = true, features = ["save-state"] }
doslet-config.workspace = true
doslet-x86.workspace = true
doslet-bus.workspace = true
doslet-dos.workspace = true
doslet-x86-wasm = { path = "../../crates/cpu/doslet-x86-wasm" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
doslet-aot = { path = "../../crates/system/doslet-aot", features = ["wasm"] }
doslet-executable.workspace = true

# Unsafe code is confined to the trusted app's synchronous opaque-handle ABI.
[lints.rust]
unsafe_code = "deny"
