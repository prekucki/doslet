[package]
name = "doslet-wasm-game-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doslet-runtime = { workspace = true, features = ["save-state"] }
doslet-config.workspace = true
doslet-x86.workspace = true
doslet-dos.workspace = true
doslet-x86-wasm = { path = "../../crates/cpu/doslet-x86-wasm" }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
serde_json = "1"

# Only the diagnostic, trusted-host WASM FFI owns/dereferences opaque handles.
[lints.rust]
unsafe_code = "deny"
