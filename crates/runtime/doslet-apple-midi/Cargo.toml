[package]
name = "doslet-apple-midi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2.18"
doslet-midi-synth.workspace = true

# Only the private Audio Unit boundary may use unsafe Rust.
[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "macos")'.dev-dependencies]
doslet-midi-routing.workspace = true
doslet-mt32.workspace = true
doslet-mt32-gm.workspace = true
moont = { version = "=1.0.0", default-features = false }
