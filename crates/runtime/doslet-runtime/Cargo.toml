[package]
name = "doslet-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
save-state = ["dep:doslet-state", "dep:prost", "doslet-config/save-state", "doslet-dos/save-state", "doslet-input/save-state", "doslet-pc/save-state", "doslet-pcm/save-state", "doslet-vfs/save-state", "doslet-vga/save-state", "doslet-x86/save-state"]
dynamic-core = ["doslet-pc/dynamic-core", "doslet-x86/dynamic-core"]
v86 = ["doslet-pc/v86"]
profiling = ["doslet-pc/profiling"]
wasm-procedures = ["doslet-pc/wasm-procedures"]
wasm-procedure-diagnostics = ["wasm-procedures", "doslet-pc/wasm-procedure-diagnostics"]
[dependencies]
prost = { workspace = true, optional = true }
doslet-state = { workspace = true, optional = true }
doslet-storage.workspace = true
doslet-vfs.workspace = true
doslet-config.workspace = true
doslet-input.workspace = true
doslet-pcm.workspace = true
doslet-iso9660.workspace = true
doslet-bus.workspace = true
doslet-x86.workspace = true
doslet-pc.workspace = true
doslet-dos.workspace = true
doslet-vga.workspace = true
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
allocation-counter = "0.8.1"
doslet-x86-wasm = { path = "../../cpu/doslet-x86-wasm" }
[lints]
workspace = true
