[package]
name = "doslet-x86"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
save-state = ["dep:doslet-state", "dep:prost", "doslet-x87/save-state"]
profiling = []
dynamic-core = ["dep:doslet-x86-jit"]
procedure-calls = []

[dependencies]
prost = { workspace = true, optional = true }
doslet-state = { workspace = true, optional = true }
doslet-bus.workspace = true
doslet-x87.workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"

[target.'cfg(all(not(target_arch = "wasm32"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
doslet-x86-jit = { path = "../doslet-x86-jit", optional = true }

[lints]
workspace = true
